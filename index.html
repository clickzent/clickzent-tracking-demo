
<!DOCTYPE html>
<html>
<head>
<script async src="https://www.googletagmanager.com/gtm.js?id=GTM-P5QVP8GH"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
</script>
  <title>CLICKZENT Tracking Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <h1>Welcome to CLICKZENT</h1>
  <p>Digital Marketing & Tracking Demo</p>

  <button id="contactBtn">Contact Us</button>
<h2>Request a Free Consultation</h2>

<form id="leadForm">
  <input type="text" id="leadName" placeholder="Your Name" required>
  <input type="email" id="leadEmail" placeholder="Your Email" required>
  <button type="submit">Submit Enquiry</button>
</form>
  <p id="leadMessage"></p>
<script>
document.getElementById("leadForm").addEventListener("submit", function(event) {
  event.preventDefault();

  document.getElementById("leadMessage").textContent =
    "Enquiry submitted successfully!";

  window.dataLayer.push({
    event: "lead_form_submit"
  });
});
</script>
  <p id="message"></p>

  <script>
    document.getElementById("contactBtn")
      .addEventListener("click", function() {
        document.getElementById("message").textContent =
          "Contact button clicked successfully!";
        console.log("contact_click event triggered");
      });
  </script>
</body>
</html>
